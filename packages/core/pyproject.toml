[project]
name = "career-core"
version = "0.1.0"
description = "Career brain common engine: domain, usecases, ports, DB, HTTP/MCP interfaces"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.8",
  "sqlalchemy[asyncio]>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pypdf>=5",
  "python-multipart>=0.0.9",
  "httpx>=0.28,<1",
  # 화면에서 넣은 모델 키를 DB에 암호화 (Fernet, adapters/secret_box.py)
  "cryptography>=44",
  # 옛 한글(.hwp, 한글 5.x)의 OLE 복합 문서 열기 (BSD-2, 순수 파이썬). 레코드는 adapters/hwp.py가 읽는다.
  "olefile>=0.47,<1",
]

[project.optional-dependencies]
# 모델 제공자 SDK는 선택. 없으면 그 어댑터만 못 쓴다.
anthropic = ["anthropic>=2.8,<3"]
openai = ["openai>=3.51,<4"]
llm = ["anthropic>=2.8,<3", "openai>=3.51,<4"]
# 로컬 임베딩 (ONNX Runtime, torch 없음). 이미지·설치를 가볍게 두려면 빼도 된다.
local-embed = ["fastembed>=0.9,<1"]
# 동적 공고 페이지 렌더링. 설치 후 `playwright install chromium` (약 150MB). 기본 구성에는 없다.
browser = ["playwright>=1.50"]
# 원격 MCP의 외부 OAuth 액세스 토큰(JWT) 검증. 인가 서버는 포함하지 않는다 (docs/architecture/mcp.md).
oauth = ["pyjwt[crypto]>=2.10,<3"]
# 스캔 PDF 공고의 쪽을 이미지로 바꿔 비전 라우트로 (PDFium 바이너리 포함 휠 ~4MB, BSD-3/Apache-2.0).
# 없으면 스캔 PDF는 `pdf_no_text`로 직접 확인 (docs/architecture/postings.md).
pdf-render = ["pypdfium2>=4.30,<6"]
# 한국어 형태소 분석 (kiwipiepy, Apache-2.0; 휠 4~12MB + 모델 sdist 88MB, 올리면 RSS ~0.42GB).
# 설치 후 `CAREER_KOREAN_ANALYZER=kiwi`일 때만 쓴다. 없으면 규칙 기반 조사 떼기 (docs/architecture/search.md).
korean = ["kiwipiepy>=0.24,<0.25"]
# 내보내기 묶음 암호화 (age 형식). `age` 명령이 있으면 그것을 먼저 쓴다 (docs/operations/backup.md).
age = ["pyrage>=1.2,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/career_core"]
