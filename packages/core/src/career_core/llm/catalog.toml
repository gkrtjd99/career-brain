# 모델 단가표 (USD / 1M tokens). 제공자 공식 가격 페이지에서 옮긴 값이다.
#
# - 가격은 문자열로 적는다 (TOML float의 이진 오차 방지).
# - 항목이 비면(예: cached_input 없음) 그 토큰은 기본 입력 단가로 계산하고 비용을 "estimated"로 표시한다.
# - cache_write: 짧은 TTL 캐시 쓰기 (Anthropic 5분, OpenAI 30분). cache_write_long: 긴 TTL (1시간, 12시간).
# - tiers: 프롬프트(입력+캐시 읽기/쓰기) 토큰 수가 min_prompt_tokens 이상이면 그 요청 전체가 해당 단가.
#   제공자마다 "초과"/"이상" 표현이 달라 숫자로 옮겼다.
# - changes: 공식 페이지에 예고된 가격 변경. effective_from 날짜(UTC)부터 기본 단가를 대체한다.
# - 배치/Flex 할인, Priority·Fast 배수, 지역 고정(data residency) 배수, 캐시 보관료(Gemini 시간당),
#   도구 사용료(웹 검색 등)는 반영하지 않는다. 그런 요청은 실제 청구액과 다를 수 있다.
# - 갱신: `personal-api pricing check` 가 오래된 항목과 라우트에 쓰였는데 단가가 없는 모델을 알려준다.
#   사용자 덮어쓰기는 models.toml의 [pricing] files에 같은 형식의 파일을 적는다.

[providers.anthropic]
source = "https://platform.claude.com/docs/en/about-claude/pricing"
as_of = 2026-11-16

[[models]]
provider = "anthropic"
model = "claude-fable-5-2"
input = "8"
cache_write = "10"
cache_write_long = "16"
cached_input = "0.20"
output = "40"

[[models]]
provider = "anthropic"
model = "claude-opus-5-5"
input = "4"
cache_write = "5"
cache_write_long = "8"
cached_input = "0.20"
output = "20"

[[models]]
provider = "anthropic"
model = "claude-opus-5"
input = "5"
cache_write = "6.25"
cache_write_long = "10"
cached_input = "0.50"
output = "25"

[[models]]
provider = "anthropic"
model = "claude-opus-4-8"
input = "5"
cache_write = "6.25"
cache_write_long = "10"
cached_input = "0.50"
output = "25"

[[models]]
provider = "anthropic"
model = "claude-sonnet-5-5"
input = "2"
cache_write = "2.50"
cache_write_long = "4"
cached_input = "0.10"
output = "10"

[[models]]
provider = "anthropic"
model = "claude-sonnet-5"
input = "2"
cache_write = "2.50"
cache_write_long = "4"
cached_input = "0.20"
output = "10"

[[models]]
provider = "anthropic"
model = "claude-sonnet-4-6"
input = "3"
cache_write = "3.75"
cache_write_long = "6"
cached_input = "0.30"
output = "15"

[[models]]
provider = "anthropic"
model = "claude-haiku-5-5"
input = "0.10"
cache_write = "0.125"
cache_write_long = "0.20"
cached_input = "0.01"
output = "0.50"

  [[models.tiers]]
  min_prompt_tokens = 100001  # "prompts over 100,000 tokens"
  input = "0.50"
  cache_write = "0.625"
  cache_write_long = "1"
  cached_input = "0.05"
  output = "2.50"

[[models]]
provider = "anthropic"
model = "claude-haiku-4-5"
input = "1"
cache_write = "1.25"
cache_write_long = "2"
cached_input = "0.10"
output = "5"

# ---------------------------------------------------------------- OpenAI
# GPT-5.6 이후 모델은 캐시 쓰기가 과금된다 (30분 1.25x, 12시간 2.5x 입력 단가).
# GPT-5.5 이전은 쓰기 추가요금이 없어 cache_write = input.
# 장문 구간(272K 입력 초과)의 캐시 쓰기 단가는 공개되지 않아 비워 두었다 (입력 단가로 계산, estimated 표시).
# gpt-5.6-sol은 2026-11-30까지 프로모션 가격이고 이후 가격이 공개되지 않아 넣지 않았다.

[providers.openai]
source = "https://developers.openai.com/api/docs/pricing"
as_of = 2026-11-16

# 임베딩: 입력 토큰만 과금된다.
