[project]
name = "career-brain-workspace"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["career-core[local-embed,oauth,age,pdf-render,korean]", "personal-api"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/core", "apps/personal-api"]

[tool.uv.sources]
career-core = { workspace = true }
personal-api = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "anyio>=4.16.0",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests", "packages/core/tests", "apps/personal-api/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
